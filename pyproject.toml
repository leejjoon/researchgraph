[project]
name = "researchgraph"
version = "0.0.1"
description = "An append-only research graph in git, for humans and agents"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = ["pyyaml>=6", "click>=8.1", "jsonschema>=4", "zstandard>=0.22"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
viewer = ["starlette>=1.9,<2", "uvicorn>=0.54,<1"]
test = ["pytest>=8", "hypothesis>=6", "pytest-benchmark", "ruff", "nbclient==0.11.0", "nbformat==5.11.1", "ipykernel==7.4.0", "httpx>=0.28.1,<1", "httpx2>=2.16,<3"]

[project.scripts]
rg = "researchgraph.cli:main"

[project.entry-points."researchgraph.profiles"]
research = "researchgraph.profiles.research:PROFILE"
tasks = "researchgraph.profiles.tasks:PROFILE"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cli: acceptance through the resolved installed console script",
    "mcp: acceptance through the optional official SDK transport",
    "http: acceptance through the optional authenticated HTTP transport",
    "performance: strict disclosed synthetic-scale budgets",
]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.setuptools.package-data]
researchgraph = ["web/*.html", "web/*.js", "web/*.css"]
